<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .box {
            padding: 20px;
            color: white;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <h2 class="mb-4 text-center">تجربة تقسيم الـ 12 عمود</h2>

        <h5 class="mt-4">4 أجزاء متساوية (كل واحد col-3)</h5>
        <div class="row g-3">
            <div class="col-md-3"><div class="box bg-primary">1/4 (col-3)</div></div>
            <div class="col-md-3"><div class="box bg-primary">1/4 (col-3)</div></div>
            <div class="col-md-3"><div class="box bg-primary">1/4 (col-3)</div></div>
            <div class="col-md-3"><div class="box bg-primary">1/4 (col-3)</div></div>
        </div>

        <h5 class="mt-4">3 أجزاء متساوية (كل واحد col-4)</h5>
        <div class="row g-3">
            <div class="col-md-4"><div class="box bg-success">1/3 (col-4)</div></div>
            <div class="col-md-4"><div class="box bg-success">1/3 (col-4)</div></div>
            <div class="col-md-4"><div class="box bg-success">1/3 (col-4)</div></div>
        </div>

        <h5 class="mt-4">جزئين غير متساويين (8 و 4)</h5>
        <div class="row g-3">
            <div class="col-md-8"><div class="box bg-warning text-dark">جزء كبير (col-8)</div></div>
            <div class="col-md-4"><div class="box bg-warning text-dark">جزء صغير (col-4)</div></div>
        </div>

        <h5 class="mt-4">نصين بالظبط (كل واحد col-6)</h5>
        <div class="row g-3">
            <div class="col-md-6"><div class="box bg-danger">نص (col-6)</div></div>
            <div class="col-md-6"><div class="box bg-danger">نص (col-6)</div></div>
        </div>
    </div>

</body>
</html>
